[package]
name = "tokio-dtls"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Async DTLS 1.3 for Tokio, powered by dimpl"
license = "MPL-2.0"
repository = "https://github.com/SemyonTs/tokio-dtls"
documentation = "https://docs.rs/tokio-dtls"
keywords = ["dtls", "tls", "tokio", "async"]
categories = ["network-programming", "cryptography"]

[lib]
path = "lib.rs"

[dependencies]
dimpl13 = { version = "0.9", features = ["rcgen"] }
tokio = { version = "1", features = ["net", "time", "sync", "macros", "rt", "rt-multi-thread"] }
thiserror = "2"
tracing = "0.1"